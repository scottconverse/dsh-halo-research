          - id: deepseek-v4.1-flash:1017-cloud
            name: DeepSeek 1017 isolated automatic compaction
            contextWindow: 1048576
            maxTokens: 65536
            reasoningEfforts:
              low: low
        compat:
          thinkingFormat: openai
          supportsReasoningEffort: true
