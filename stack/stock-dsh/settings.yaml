permission:
  defaultPreset: danger-full-access
agent-default-model:
  provider: lmstudio
  model: halo-coder-q4km
agent-presets:
  default: local
llm-pi-ai:
  providers:
    lmstudio:
      displayName: LM Studio local
      apiKeyEnv: LMSTUDIO_API_KEY
      api: openai-completions
      baseURL: http://127.0.0.1:1234/v1
      defaultInput: [ text ]
      defaultContextWindow: 131072
      defaultMaxTokens: 8192
      reasoning: off
      streamIdleTimeoutMs: 600000
      models:
        - id: halo-brain-35b
          name: Qwen3.6 35B-A3B - planner and vision
          contextWindow: 131072
          maxTokens: 8192
          input: [ text, image ]
          reasoningEfforts:
            off: none
            high: high
        - id: halo-coder-q4km
          name: Qwen3 Coder 30B-A3B Q4_K_M - default
          contextWindow: 131072
          maxTokens: 8192
          input: [ text ]
          reasoningEfforts: false
    google:
      apiKeyEnv: GOOGLE_API_KEY
    ollama:
      displayName: Ollama Cloud
      # The local Ollama daemon accepts this existing non-secret gateway placeholder
      # while its signed-in daemon forwards cloud requests.
      apiKeyEnv: LMSTUDIO_API_KEY
      api: openai-completions
      baseURL: http://127.0.0.1:11434/v1
      defaultContextWindow: 131072
      defaultMaxTokens: 8192
      reasoning: off
      models:
        - id: deepseek-v4.1-flash:cloud
          name: DeepSeek V4.1 Flash (Ollama Cloud)
          contextWindow: 1048576
          maxTokens: 8192
          input: [ text, image ]
          reasoningEfforts:
            off: null
            low: low
subagent-model-selection:
  enabled: true
  allowedModels:
    - provider: lmstudio
      model: halo-brain-35b
    - provider: lmstudio
      model: halo-coder-q4km
ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
