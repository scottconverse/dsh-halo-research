permission:
  defaultPreset: danger-full-access
agent-default-model:
  provider: ollama
  model: deepseek-v4.1-flash:cloud
agent-presets:
  default: local
llm-pi-ai:
  providers:
    lmstudio:
      displayName: LM Studio local
      apiKeyEnv: LMSTUDIO_API_KEY
      api: openai-completions
      baseURL: http://127.0.0.1:1234/v1
      defaultInput:
        - text
      defaultContextWindow: 131072
      defaultMaxTokens: 8192
      reasoning: off
      streamIdleTimeoutMs: 600000
      models:
        - id: halo-coder-q4km
          name: Qwen3 Coder 30B-A3B - saved Web sessions
          contextWindow: 131072
          maxTokens: 8192
          input: [ text ]
          reasoningEfforts: false
        - id: halo/qwen3-coder-30b-a3b-q4km
          name: Qwen3 Coder 30B-A3B Q4_K_M
          contextWindow: 131072
          maxTokens: 8192
          input:
            - text
          reasoningEfforts: false
    ollama:
      displayName: Ollama Cloud
      apiKeyEnv: LMSTUDIO_API_KEY
      api: openai-completions
      baseURL: http://127.0.0.1:11434/v1
      defaultContextWindow: 131072
      defaultMaxTokens: 8192
      models:
        - id: deepseek-v4.1-flash:cloud
          name: DeepSeek V4.1 Flash (Ollama Cloud)
          contextWindow: 1048576
          maxTokens: 8192
          input:
            - text
            - image
          reasoningEfforts:
            'off': none
            low: low
            high: high
            max: max
        - id: glm-5.3:cloud
          name: GLM-5.3 (Ollama Cloud)
          contextWindow: 1048576
          maxTokens: 8192
          input:
            - text
          reasoningEfforts:
            low: low
            high: high
            max: max
        - id: kimi-k3:cloud
          name: Kimi K3 (Ollama Cloud)
          contextWindow: 1048576
          maxTokens: 8192
          input:
            - text
            - image
          reasoningEfforts:
            'off': none
            low: low
            high: high
            max: max
        - id: minimax-m3:cloud
          name: "MiniMax M3 (Ollama Cloud) — provider-default thinking"
          contextWindow: 512000
          maxTokens: 8192
          input:
            - text
            - image
          reasoningEfforts: false
        - id: glm-5.3-flash:cloud
          name: GLM-5.3 Flash (Ollama Cloud)
          contextWindow: 1048576
          maxTokens: 8192
          input:
            - text
            - image
          reasoningEfforts:
            low: low
            high: high
            max: max
      compat:
        thinkingFormat: openai
        supportsReasoningEffort: true
        # BEGIN generated Ollama Cloud models
        # END generated Ollama Cloud models
    lmstudio-brain:
      displayName: LM Studio brain
      apiKeyEnv: LMSTUDIO_API_KEY
      api: openai-completions
      baseURL: http://127.0.0.1:1234/v1
      defaultInput:
        - text
      defaultContextWindow: 131072
      defaultMaxTokens: 8192
      reasoning: high
      streamIdleTimeoutMs: 600000
      models:
        - id: halo-brain-35b
          name: Qwen3.6 35B-A3B - saved Web sessions
          contextWindow: 131072
          maxTokens: 8192
          input: [ text, image ]
          reasoningEfforts: { off: none, high: high }
        - id: halo/qwen3.6-35b-a3b
          name: Qwen3.6 35B-A3B - planner and vision
          contextWindow: 131072
          maxTokens: 8192
          input:
            - text
            - image
          reasoningEfforts:
            off: none
            high: high
    lmstudio-qwen38:
      displayName: LM Studio Qwen3.8
      apiKeyEnv: LMSTUDIO_API_KEY
      api: openai-completions
      baseURL: http://127.0.0.1:1234/v1
      defaultInput:
        - text
      defaultContextWindow: 131072
      defaultMaxTokens: 24576
      reasoning: medium
      streamIdleTimeoutMs: 600000
      models:
        - id: halo/qwen3.8-27b-q6
          name: Qwen3.8 27B Q6_K (local)
          contextWindow: 131072
          maxTokens: 24576
          input:
            - text
          reasoningEfforts:
            'off': none
            low: low
            medium: medium
            xhigh: xhigh
    # BEGIN generated Desktop model library
    lmstudio-library:
      displayName: LM Studio downloaded
      apiKeyEnv: LMSTUDIO_API_KEY
      api: openai-completions
      baseURL: http://127.0.0.1:1234/v1
      defaultInput: [ text ]
      defaultContextWindow: 131072
      defaultMaxTokens: 8192
      streamIdleTimeoutMs: 600000
      models:
        - id: "halo/qwen3.8-27b-q4km"
          name: "Qwen3.8 27B Q4_K_M - Halo tuned (startup default)"
          contextWindow: 131072
          maxTokens: 16384
          input: [ text ]
          reasoningEfforts: { off: none, low: low, medium: medium, xhigh: xhigh }
        - id: "qwen/qwen3.6-35b-a3b"
          name: "Qwen3.6 35B A3B Q4_K_M [qwen/qwen3.6-35b-a3b]"
          contextWindow: 131072
          maxTokens: 8192
          input: [ text, image ]
          reasoningEfforts: { off: none, high: high }
        - id: "qwen/qwen3.8-27b"
          name: "Qwen3.8 27B Q6_K [qwen/qwen3.8-27b]"
          contextWindow: 131072
          maxTokens: 8192
          input: [ text, image ]
          reasoningEfforts: { off: none, low: low, medium: medium, xhigh: xhigh }
        - id: "qwen3-coder-30b-a3b-instruct"
          name: "Qwen3 Coder 30B A3B Instruct Q4_K_M [qwen3-coder-30b-a3b-instruct]"
          contextWindow: 131072
          maxTokens: 8192
          input: [ text ]
    ollama-local:
      displayName: Ollama local
      apiKeyEnv: LMSTUDIO_API_KEY
      api: openai-completions
      baseURL: http://127.0.0.1:11434/v1
      defaultInput: [ text ]
      defaultContextWindow: 32768
      defaultMaxTokens: 8192
      models:
        - id: "qwen3-coder:30b-a3b-q4_K_M"
          name: "qwen3-coder:30b-a3b-q4_K_M (Ollama local)"
          contextWindow: 131072
          maxTokens: 8192
          input: [ text ]
          reasoningEfforts: false
        - id: "qwen3.6:35b-a3b-q4_K_M"
          name: "qwen3.6:35b-a3b-q4_K_M (Ollama local)"
          contextWindow: 131072
          maxTokens: 8192
          input: [ text, image ]
          reasoningEfforts:
            off: none
            high: high
        - id: "qwen3.8:27b-q4_K_M"
          name: "qwen3.8:27b-q4_K_M (Ollama local)"
          contextWindow: 131072
          maxTokens: 8192
          input: [ text, image ]
          reasoningEfforts:
            off: none
            low: low
            medium: medium
            xhigh: xhigh
    # END generated Desktop model library
subagent-model-selection:
  enabled: true
  allowedModels:
    - provider: lmstudio-brain
      model: halo-brain-35b
    - provider: lmstudio
      model: halo-coder-q4km
ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
