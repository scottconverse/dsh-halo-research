ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1

# Full-machine authority for future Halo sessions. Existing sessions retain
# the permission preset they were created with.
permission:
  defaultPreset: danger-full-access

# Launch-Halo refreshes all API-advertised LLM choices, including LM Link,
# without deleting custom/offline entries. Embeddings are not chat models.
# Discovery is not acceptance testing; raw/remote load settings remain owned
# by LM Studio. Only the tuned aliases have a verified 32K/one-slot envelope.
llm-pi-ai:
  providers:
    lmstudio:
      displayName: LM Studio (local + LM Link)
      # LM Studio ignores this value, but the OpenAI-compatible client requires
      # a non-empty credential. Launch-Halo.ps1 supplies the local dummy `x`.
      apiKeyEnv: LMSTUDIO_API_KEY
      api: openai-completions
      baseURL: http://127.0.0.1:1234/v1
      defaultInput: [ text ]
      defaultContextWindow: 32768
      defaultMaxTokens: 8192
      models:
        - id: halo/qwen3.8-27b
          name: Halo Qwen3.8 27B Q5_K_XL (tuned cockpit)
          contextWindow: 32768
