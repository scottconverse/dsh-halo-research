# Hide the bundled DeepSeek API catalog. This machine has no DeepSeek API key;
# Codex and Claude are exposed as native subscription-backed subagent tools.
llm-deepseek:
  models: []

# Model selection is operator-controlled through DSH. This file records the
# current selection; a live user selection and the recovery baseline may differ.
agent-default-model:
  provider: lmstudio
  model: halo/qwen3.6-35b-a3b
  # No graded reasoning effort is injected here. The selected provider/model
  # resolves its real Boolean or provider-owned contract at request time.
