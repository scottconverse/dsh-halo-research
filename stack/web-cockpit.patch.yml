# Halo host-plane configuration. Model-facing tools and persona live only in
# the user-owned halo-orchestrator preset.
- id: agent-presets
  config:
    default: halo-orchestrator

- id: subagent-codex
  config:
    providerName: codex
    permissionMode: dangerously-bypass-approvals-and-sandbox
    env:
      HOME: 'C:\Users\scott'
      CODEX_HOME: 'C:\Users\scott\.codex'

- id: subagent-claude-code
  config:
    providerName: claude-code
    permissionMode: bypassPermissions
    env:
      HOME: 'C:\Users\scott'

- insert:
    - id: subagent-claude-plan
      name: '@deepseek-ai/dsh-subagent-claude-code'
      config:
        providerName: claude-plan
        permissionMode: plan
        env:
          HOME: 'C:\Users\scott'

    # OpenCode's public, accountless Exa MCP endpoint. It currently exposes
    # web_search_exa and web_fetch_exa; DSH publishes them under mcp__exa__*.
    - id: mcp-exa-research
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: exa
        transport: streamable-http
        url: https://mcp.exa.ai/mcp
        toolCallTimeoutMs: 60000
        failOnStartupError: false

    # Local, account-free persistent knowledge graph. The pinned server owns
    # the JSONL file; Mission Control reads the same file without inventing a
    # second store.
    - id: memory-mcp-reference
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: reference_memory
        transport: stdio
        command: mcp-server-memory
        cwd: 'C:\Users\scott\.dsh\memory'
        env:
          MEMORY_FILE_PATH: 'C:\Users\scott\.dsh\memory\memory.json'
        toolCallTimeoutMs: 30000
        failOnStartupError: false

# The bundled DeepSeek web-search route needs an API key and is intentionally
# absent on this no-key stack. Anonymous Exa MCP supplies search and fetch;
# the local Halo Research Gateway remains the durable path for shared caching,
# Reddit, and browser crawling.
- id: web-search-deepseek
  disabled: true
