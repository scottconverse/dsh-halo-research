# Halo host-plane configuration. Model-facing tools and persona live only in
# the user-owned halo-orchestrator preset.
- id: agent-presets
  config:
    default: halo-orchestrator

- id: subagent-codex
  config:
    providerName: codex
    permissionMode: dangerously-bypass-approvals-and-sandbox
    env:
      HOME: 'C:\Users\scott'
      CODEX_HOME: 'C:\Users\scott\.codex'

- id: subagent-claude-code
  config:
    providerName: claude-code
    permissionMode: bypassPermissions
    env:
      HOME: 'C:\Users\scott'

- insert:
    - id: subagent-claude-plan
      name: '@deepseek-ai/dsh-subagent-claude-code'
      config:
        providerName: claude-plan
        permissionMode: plan
        env:
          HOME: 'C:\Users\scott'

    # One machine-wide localhost research service. It owns anonymous Exa/DDGS,
    # direct fetch, Reddit pacing, Crawl4AI, cache, citations, jobs, local
    # allow-listed targets, and approved action receipts. Keeping DSH behind
    # this seam prevents each session from bypassing shared budgets.
    - id: mcp-halo-research
      disabled: true
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: halo_research
        transport: streamable-http
        url: http://127.0.0.1:8765/mcp
        toolCallTimeoutMs: 120000
        failOnStartupError: true

    # Local, account-free persistent knowledge graph. The pinned server owns
    # the JSONL file; Mission Control reads the same file without inventing a
    # second store.
    - id: memory-mcp-reference
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: reference_memory
        transport: stdio
        command: mcp-server-memory
        cwd: 'C:\Users\scott\.dsh\memory'
        env:
          MEMORY_FILE_PATH: 'C:\Users\scott\.dsh\memory\memory.json'
        toolCallTimeoutMs: 30000
        failOnStartupError: false

# The bundled DeepSeek web-search route needs an API key and is intentionally
# absent on this no-key stack. The local Halo Research Gateway supplies search,
# fetch, Reddit, documents, browser crawling, shared cache, and bounded jobs.
- id: web-search-deepseek
  disabled: true

- insert:
    - id: halo-native-cli-provider
      name: file:///C:/Users/scott/Desktop/Code/dsh-halo-research/stack/provider-integration/cli-provider.mjs
      config:
        dataRoot: C:/Users/scott/.dsh/native-cli
